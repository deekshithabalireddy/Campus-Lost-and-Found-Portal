<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Item | Campus Lost & Found</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="/">Campus Lost & Found</a>
        <div class="nav-links" id="navLinks"></div>
    </nav>

    <main class="container">
        <form id="reportForm" class="form-card">
            <h1>Report an Item</h1>
            <p>Enter accurate details to help reconnect belongings with owners.</p>

            <div id="formMessage" class="message hidden" role="alert"></div>

            <div class="form-group">
                <label for="name">Item name</label>
                <input id="name" name="name" maxlength="100" required>
            </div>

            <div class="form-group">
                <label for="type">Report type</label>
                <select id="type" name="type" required>
                    <option value="">Select type</option>
                    <option value="Lost">I lost an item</option>
                    <option value="Found">I found an item</option>
                </select>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" required>
                    <option value="">Select category</option>
                    <option>Electronics</option>
                    <option>Books</option>
                    <option>Accessories</option>
                    <option>Bags</option>
                    <option>Documents</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description"
                          maxlength="1000" required></textarea>
            </div>

            <div class="form-group">
                <label for="location">Location on campus</label>
                <input id="location" name="location" maxlength="150" required>
            </div>

            <div class="form-group">
                <label for="date">Date lost or found</label>
                <input id="date" name="date" type="date" required>
            </div>

            <div class="form-group">
                <label for="image">Image URL (optional)</label>
                <input id="image" name="image" type="url"
                       placeholder="https://example.com/item.jpg">
            </div>

            <button class="btn" type="submit">Submit Report</button>
        </form>
    </main>
</body>
</html>
