<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Campus Lost & Found</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="/">Campus Lost & Found</a>
        <div class="nav-links" id="navLinks"></div>
    </nav>

    <main class="container">
        <form id="registerForm" class="form-card">
            <h1>Create Account</h1>
            <p>Register to report items and submit claims.</p>

            <div id="formMessage" class="message hidden" role="alert"></div>

            <div class="form-group">
                <label for="name">Full name</label>
                <input id="name" name="name" autocomplete="name"
                       maxlength="80" required>
            </div>

            <div class="form-group">
                <label for="email">Email address</label>
                <input id="email" name="email" type="email"
                       autocomplete="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password (minimum 8 characters)</label>
                <input id="password" name="password" type="password"
                       minlength="8" autocomplete="new-password" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm password</label>
                <input id="confirmPassword" name="confirmPassword"
                       type="password" minlength="8"
                       autocomplete="new-password" required>
            </div>

            <button class="btn" type="submit">Register</button>

            <p style="margin-top:18px">
                Already registered? <a href="/login.html">Login</a>
            </p>
        </form>
    </main>
</body>
</html>
