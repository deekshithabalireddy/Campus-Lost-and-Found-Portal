<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Campus Lost & Found</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="/">Campus Lost & Found</a>
        <div class="nav-links" id="navLinks"></div>
    </nav>

    <main class="container">
        <form id="loginForm" class="form-card">
            <h1>Welcome Back</h1>
            <p>Login to manage your reports and claims.</p>

            <div id="formMessage" class="message hidden" role="alert"></div>

            <div class="form-group">
                <label for="email">Email address</label>
                <input id="email" name="email" type="email"
                       autocomplete="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" name="password" type="password"
                       autocomplete="current-password" required>
            </div>

            <button class="btn" type="submit">Login</button>
            <p style="margin-top:18px">
                Don't have an account? <a href="/register.html">Register</a>
            </p>
        </form>
    </main>
</body>
</html>
